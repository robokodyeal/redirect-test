<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid #334155;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        input[type="text"] {
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background: #0ea5e9;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Redirect Test</h1>
        <p>Yönlendirilmek istediğiniz adresi girin</p>
        
        <form id="redirectForm">
            <div class="input-group">
                <label for="urlInput">Hedef URL</label>
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="google.com veya https://..." 
                    autocomplete="off" 
                    required
                >
            </div>
            <button type="submit">Git</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('redirectForm');
        const input = document.getElementById('urlInput');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            let url = input.value.trim();

            if (!url) return;

            // Eğer başında http:// veya https:// yoksa otomatik olarak https:// ekle
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // Sayfayı yönlendir
            window.location.href = url;
        });
    </script>

</body>
</html>
